name: Atualizar radar de oportunidades

"on":
  schedule:
    # 9h UTC = 6h em Junqueirópolis (UTC-3) — roda 1x por dia
    - cron: "0 9 * * *"
  workflow_dispatch: {} # permite rodar manualmente pela aba Actions do GitHub

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python gerar_relatorio.py

      - name: Desativa processamento Jekyll no GitHub Pages
        run: touch docs/.nojekyll

      - name: Commit e push se o radar mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/data.json docs/.nojekyll
          git diff --staged --quiet && echo "sem mudança, nada pra commitar" || \
            (git commit -m "Atualiza radar de oportunidades ($(date -u +%Y-%m-%d))" && git push)
